[project]
name = "telegram-business-archive"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["aiogram>=3.31,<4", "alembic>=1.14", "asyncpg>=0.30", "fastapi>=0.115", "httpx>=0.28", "pydantic-settings>=2.7", "sqlalchemy[asyncio]>=2.0.36", "structlog>=24.4", "uvicorn[standard]>=0.34"]
[dependency-groups]
dev = ["aiosqlite>=0.20", "mypy>=1.14", "pytest>=8.3", "pytest-asyncio>=0.25", "ruff>=0.9"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
[tool.ruff]
target-version = "py312"
line-length = 100
[tool.ruff.lint]
select = ["F"]
[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true
